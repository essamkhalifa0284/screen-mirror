<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>المرآة</title>
  <meta name="description" content="مرآة على شاشة الموبايل أو الكمبيوتر باستخدام الكاميرا الأمامية أو بدونها">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المرآة">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="stage ring-on show-ui" data-shape="rounded">
    <div id="frame">
      <div id="viewport">
        <video id="video" autoplay muted playsinline></video>
        <div id="grid" hidden></div>
        <div id="flash"></div>
      </div>
    </div>

    <div id="frozenBadge" class="badge" hidden>الصورة متجمّدة</div>

    <div id="message" class="card" hidden>
      <p id="messageText"></p>
      <button id="retryBtn" class="text-btn primary">تشغيل الكاميرا</button>
    </div>

    <header class="topbar chrome">
      <a class="btn pill" href="black.html" title="مرآة بدون كاميرا">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5" fill="currentColor" fill-opacity="0.3"/><path d="M9 9l3-2M9 13l6-4"/></svg>
        بدون كاميرا
      </a>
      <div class="group">
        <button class="btn round" id="fullBtn" title="ملء الشاشة" hidden>
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="btn round" id="settingsBtn" title="الإعدادات" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>

    <section id="sheet" class="sheet" hidden aria-label="الإعدادات">
      <label class="field">
        <span>التكبير <output id="zoomOut"></output></span>
        <input type="range" id="zoom" min="1" max="3" step="0.05">
      </label>
      <label class="field">
        <span>سطوع الصورة <output id="brightnessOut"></output></span>
        <input type="range" id="brightness" min="50" max="180" step="1">
      </label>
      <label class="field-row">
        <span>إضاءة حول المرآة</span>
        <input type="checkbox" class="switch" id="ringToggle">
      </label>
      <label class="field">
        <span>قوة الإضاءة <output id="ringSizeOut"></output></span>
        <input type="range" id="ringSize" min="1" max="20" step="1">
      </label>
      <label class="field">
        <span>لون الإضاءة <small>بارد ← دافئ</small></span>
        <input type="range" id="warmth" class="warmth" min="0" max="100" step="1">
      </label>
      <div class="field">
        <span>شكل المرآة</span>
        <div class="seg" id="shapeSeg">
          <button data-shape="rect">مستطيل</button>
          <button data-shape="rounded">حواف ناعمة</button>
          <button data-shape="oval">بيضاوي</button>
        </div>
      </div>
      <label class="field-row">
        <span>خطوط الاستقامة</span>
        <input type="checkbox" class="switch" id="gridToggle">
      </label>
      <button id="resetBtn" class="text-btn">استعادة الإعدادات الافتراضية</button>
      <p class="note">اقرص الشاشة بإصبعين للتكبير، واضغط عليها لإظهار أو إخفاء الأزرار.</p>
    </section>

    <nav class="toolbar chrome" aria-label="أدوات المرآة">
      <button class="btn" id="lightBtn" title="الإضاءة" aria-pressed="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn" id="flipBtn" title="كما يراك الآخرون" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
      </button>
      <button class="btn shutter" id="photoBtn" title="التقاط صورة">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="btn" id="freezeBtn" title="تجميد الصورة" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="btn" id="switchBtn" title="تبديل الكاميرا">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 12.5a2.6 2.6 0 0 1 4.6-1.4M14.5 13.5a2.6 2.6 0 0 1-4.6 1.4M14.3 9.6v1.6h-1.6M9.7 16.4v-1.6h1.6"/></svg>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
